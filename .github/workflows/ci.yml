name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate browser tests and network isolation
        run: |
          npm run lint:browser
          npm run test:browser:types
          npm run test:browser:policy

      - name: Test isolated storefront production bundle
        run: npm run test:browser

      - name: Save synthetic browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: karcher_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karcher_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karcher_smoke
      POSTGRES_SMOKE_ALLOW: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and TypeScript builds
        run: npm test

      - name: Build client through production preflight
        env:
          CLIENT_ENV_FILE: ${{ runner.temp }}/karcher-client.env
          EXPECTED_VITE_API_URL: https://api.ci.example.com
        run: |
          (
            umask 077
            printf '%s\n' \
              'VITE_API_URL=https://api.ci.example.com' \
              'VITE_SITE_URL=https://ci.example.com' \
              'VITE_TURNSTILE_SITE_KEY=ci-turnstile-public-key' \
              'VITE_YANDEX_MAPS_API_KEY=ci-yandex-browser-key' \
              'VITE_CDEK_FROM_CODE=123456' \
              'VITE_CDEK_FROM_LOCATION=Krasnoyarsk' \
              'VITE_CDEK_DEFAULT_LOCATION=Krasnoyarsk' \
              >"$CLIENT_ENV_FILE"
          )
          npm run client:config:check
          npm run client:build

      - name: Fresh PostgreSQL schema and transaction smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16 age
          node scripts/ci/postgres-smoke.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate deploy shell
        run: |
          bash -n deploy.sh
          shellcheck deploy.sh scripts/tests/deploy.test.sh
          bash scripts/tests/deploy.test.sh

      - name: Validate operations package
        run: |
          npm run test:ops
          shellcheck ops/backup/karcher-backup.sh ops/backup/st24-backup.sh
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends rsync acl
          python3 -m unittest discover -s ops/backup -p 'test_*.py'
          python3 -m unittest discover -s ops/monitoring -p 'test_*.py'
          sudo useradd --system --user-group --no-create-home karcher-api
          sudo useradd --system --user-group --no-create-home karcher-monitor
          sudo install -d /etc/karcher /etc/karcher-monitor
          sudo touch /etc/karcher/api.env /etc/karcher-monitor/monitor.env
          sudo install -d /var/www/st24/server/uploads /var/www/st24/server/tmp
          sudo install -d /var/www/st24/monitor
          sudo ln -sf "$(command -v node)" /usr/bin/node
          systemd-analyze verify ops/systemd/*.service ops/systemd/*.timer
          sudo install -d -m 0700 /usr/local/lib/karcher-backup
          systemd-analyze verify ops/backup/karcher-backup-health.service ops/backup/karcher-backup-health.timer
          systemd-analyze verify ops/backup/karcher-backup-retention.service ops/backup/karcher-backup-retention.timer

      - name: Validate isolated host firewall
        run: |
          sudo systemctl mask nftables.service
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends nftables
          shellcheck ops/security/load-firewall.sh
          sudo python3 ops/security/test-firewall.py
          sudo install -d -m 0755 /usr/local/lib/karcher-security
          sudo install -m 0700 ops/security/load-firewall.sh /usr/local/lib/karcher-security/load-firewall.sh
          # The loader is intentionally root-only (0700), like the service itself.
          sudo systemd-analyze verify ops/security/karcher-firewall.service

      - name: Validate panel retirement safeguards
        run: sudo python3 -B -m unittest discover -s ops/security -p 'test_panel_*.py'

      - name: Validate runtime upgrade safeguards
        run: python3 -B -m unittest discover -s ops/runtime -p 'test_*.py'

      - name: Validate isolated nginx host configuration
        run: |
          sudo systemctl mask nginx.service
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends nginx openssl iproute2
          sudo python3 ops/nginx/test-config.py
