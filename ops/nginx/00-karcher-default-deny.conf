# Unknown HTTP hosts and direct IP requests must not select the shop.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ "";
    return 404;
}

# The shop has its own IPv4 HTTPS vhost and certificate; keep it unchanged.
# Reject unknown or missing TLS SNI without borrowing the shop certificate.
server {
    listen 443 ssl default_server;
    server_name _ "";
    ssl_reject_handshake on;
    return 404;
}
